<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="logo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#7C2D12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Icon Tile -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="14" fill="url(#logo-grad)"/>
    <rect x="1" y="1" width="50" height="50" rx="13" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.2"/>

    <!-- Synaptic Pulse M Mark -->
    <g filter="url(#logo-shadow)" transform="scale(0.8125)">
      <!-- Left Architectural Pillar -->
      <path d="M 16 47 V 21 C 16 17.5 18.2 15 21.5 15 C 24.8 15 27 17.5 27 21 V 47" 
            stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Central Synapse / Voice Valley -->
      <path d="M 27 22 L 32 32.5 L 37 22" 
            stroke="url(#logo-glow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Right Architectural Pillar -->
      <path d="M 37 21 C 37 17.5 39.2 15 42.5 15 C 45.8 15 48 17.5 48 21 V 47" 
            stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Central Neural / Voice Frequency Node -->
      <circle cx="32" cy="33" r="3.2" fill="#EA580C" stroke="white" stroke-width="2"/>
      
      <!-- Voice Pulse Resonance Arcs -->
      <path d="M 29.5 42.5 Q 32 39.5 34.5 42.5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 26.5 46.5 Q 32 41.5 37.5 46.5" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="72" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
    Mindset
  </text>
  <!-- Accent badge dot -->
  <circle cx="166" cy="24" r="3.5" fill="#F97316"/>

  <text x="73" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#EA580C">
    VOICE-FIRST SYSTEM COACHING
  </text>
</svg>
