name: CI

on:
  push:
    branches: [main, overnight]
  pull_request:
    branches: [main, overnight]

jobs:
  verify:
    name: Build, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: pnpm --filter @mindset/shared build

      - name: Run Typecheck
        run: pnpm -r typecheck

      - name: Run Tests (Unit & Integration)
        run: pnpm -r test

      - name: Build All Workspaces
        run: pnpm -r build

  docker-verify:
    name: Verify Docker Container Build & Healthz
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t mindset-test:latest .

      - name: Run Container and Verify /healthz
        run: |
          RANDOM_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          RANDOM_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          docker run -d --name mindset-container -p 3000:3000 \
            -e NODE_ENV=production \
            -e ENCRYPTION_KEY="$RANDOM_KEY" \
            -e SESSION_SECRET="$RANDOM_SECRET" \
            mindset-test:latest
          sleep 8
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/healthz || (docker logs mindset-container && exit 1)
